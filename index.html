<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MedVault v3</title><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><style>body{margin:0;font-family:Arial;background:#070a12;color:#fff}header{display:flex;justify-content:space-between;padding:20px 32px;border-bottom:1px solid #222}.logo{font-size:28px;font-weight:bold;color:#7c5cff}.hero{padding:48px 32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:0 32px 40px}.card{background:#111827;padding:18px;border-radius:16px}button{padding:10px 16px;border-radius:10px;border:0;background:#7c5cff;color:#fff;font-weight:bold;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.box{background:#111827;padding:24px;border-radius:16px;width:min(420px,92vw)}input{width:100%;padding:12px;margin:8px 0;background:#0b1020;border:1px solid #333;color:#fff;border-radius:8px}#dash{display:none;padding:32px}</style></head><body><header><div class='logo'>MedVault</div><button onclick='openM()'>Sign In</button></header><section class='hero'><h1>Your Notes. Your Library.</h1><p>Premium MBBS & College PDF marketplace.</p></section><section class='grid'><div class='card'><h3>Anatomy</h3><p>NPR 999</p></div><div class='card'><h3>Physiology</h3><p>NPR 799</p></div><div class='card'><h3>Biochemistry</h3><p>NPR 699</p></div></section><section id='dash'><h2>Student Dashboard</h2><p id='welcome'></p><div class='card'><h3>My Library</h3><p>Purchased PDFs will appear here.</p></div><button onclick='logout()'>Logout</button></section><div id='m' class='modal'><div class='box'><h2>Login</h2><input id='e' placeholder='Email'><input id='p' type='password' placeholder='Password'><button onclick='signup()' style='width:100%'>Create Account</button><button onclick='login()' style='width:100%;margin-top:8px;background:#222'>Login</button><p id='msg'></p></div></div><script>const supabase=window.supabase.createClient('https://uefimyichqaonbsihaaw.supabase.co','sb_publishable_tu-K2ldk7iIMfAn63UhVnQ_07JHlUlL');function openM(){m.style.display='flex'}function closeM(){m.style.display='none'}async function signup(){const{error}=await supabase.auth.signUp({email:e.value,password:p.value});msg.textContent=error?error.message:'Account created. Now log in.'}async function login(){const{error}=await supabase.auth.signInWithPassword({email:e.value,password:p.value});if(error){msg.textContent=error.message;return}const{data}=await supabase.auth.getUser();welcome.textContent='Welcome, '+data.user.email;dash.style.display='block';document.querySelector('.hero').style.display='none';document.querySelector('.grid').style.display='none';closeM()}async function logout(){await supabase.auth.signOut();location.reload()}</script></body></html>
