<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedVault</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070a12;color:#fff;font-family:Arial}header{display:flex;justify-content:space-between;padding:20px 32px;border-bottom:1px solid #222}.logo{font-size:28px;font-weight:bold;color:#7c5cff}.hero{padding:56px 32px;max-width:680px}button{padding:12px 18px;border-radius:10px;border:0;background:#7c5cff;color:#fff;font-weight:bold}input{width:100%;padding:12px;margin:8px 0;background:#111;border:1px solid #333;border-radius:8px;color:#fff}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.box{background:#111827;padding:24px;border-radius:16px;width:min(420px,92vw)}#dash{display:none;padding:32px}</style></head><body><header><div class="logo">MedVault</div><button onclick="openM()">Sign in</button></header><section class="hero"><h1>Your notes. Your library.</h1><p>Live MedVault connected to Supabase.</p><button onclick="openM()">Create Account</button></section><section id="dash"><h2>Student Dashboard</h2><p id="welcome"></p><button onclick="logout()">Logout</button></section><div id="m" class="modal"><div class="box"><h2>Login</h2><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password"><button onclick="signup()" style="width:100%">Create Account</button><button onclick="login()" style="width:100%;margin-top:8px;background:#222">Login</button><p id="msg"></p></div></div><script>const supabase=window.supabase.createClient("https://uefimyichqaonbsihaaw.supabase.co","sb_publishable_tu-K2ldk7iIMfAn63UhVnQ_07JHlUlL");function openM(){document.getElementById("m").style.display="flex"}function closeM(){document.getElementById("m").style.display="none"}async function signup(){const{error}=await supabase.auth.signUp({email:e.value,password:p.value});msg.textContent=error?error.message:"Account created!"}async function login(){const{error}=await supabase.auth.signInWithPassword({email:e.value,password:p.value});if(error){msg.textContent=error.message;return}loadUser()}async function loadUser(){const{data}=await supabase.auth.getUser();if(data.user){document.querySelector(".hero").style.display="none";document.querySelector("header button").style.display="none";dash.style.display="block";welcome.textContent="Welcome, "+data.user.email;closeM()}}async function logout(){await supabase.auth.signOut();location.reload()}loadUser()</script></body></html>
